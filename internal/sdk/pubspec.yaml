name: reclaim_inapp_sdk
description: Pre-built widgets library to export user's data with provable authenticity using HTTPS & Reclaim Protocol Zero-knowledge proof technology
version: 0.36.0
homepage: https://docs.reclaimprotocol.org/inapp-sdks/introduction
repository: https://github.com/reclaimprotocol/reclaim-inapp-sdk.git
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.11.0
  fluttertoast: ^9.0.0
  uuid: ^4.4.0
  native_dio_adapter: ^1.3.0
  device_info_plus: ^12.2.0
  dio: ^5.0.0
  cupertino_icons: ^1.0.3
  shared_preferences: ^2.0.6
  path_provider: ^2.0.0
  crypto: ^3.0.0
  flutter_svg: ^2.0.0
  logging: ^1.2.0
  intl: 0.20.2
  yaml: ^3.0.0
  package_info_plus: ^9.0.0
  dio_smart_retry: ^7.0.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  clock: ^1.1.1
  flutter_secure_storage: ^10.0.0
  permission_handler: ^12.0.0+1
  pool: ^1.0.0
  meta: ^1.0.0
  pointycastle: ^4.0.0
  measure_performance: ^1.2.0
  equatable: ^2.0.7
  xxh3: ^1.2.0
  async: ^2.12.0
  synchronized: ^3.3.1
  http: ^1.3.0
  path: ^1.9.1
  cupertino_http: ^2.1.1
  cronet_http: ^1.3.3
  simple_shimmer: ^0.1.0+1
  url_launcher: ^6.3.1
  vector_math: ^2.1.4
  mesh: ^0.5.0
  retry: ^3.1.2
  convert: ^3.1.2
  collection: ^1.19.1

  # Reclaim TEE operator for native protocol execution
  reclaim_tee_operator_flutter:
    git:
      url: https://github.com/reclaimprotocol/reclaim-inapp-flutter-sdk.git
      ref: 0.36.0
      path: internal/tee_operator

  web_socket: ^1.0.1
  http_parser: ^4.0.0
  rive: ^0.14.0-dev.14
  pub_semver: ^2.2.0
  flutter_localizations:
    sdk: flutter
  # Not supported yet :(
  # javascript_flutter: ^1.2.0
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_inappwebview_android: ^1.2.0-beta.3
  flutter_inappwebview_ios: ^1.2.0-beta.3
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animated_icons/
    - assets/icons/
    - assets/scripts/
    - pubspec.yaml
